apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: scaphandre
  namespace: monitoring
  labels:
    app.kubernetes.io/name: scaphandre
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: scaphandre
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scaphandre
        release: prometheus
    spec:
      hostPID: true
      serviceAccountName: scaphandre
      containers:
      - name: scaphandre
        image: hubblo/scaphandre:latest
        args:
        - prometheus
        - --containers
        - --port
        - "8080"
        securityContext:
          privileged: true
        ports:
        - containerPort: 8080
          name: metrics
        volumeMounts:
        - mountPath: /sys
          name: sys
          readOnly: true
        - mountPath: /proc
          name: proc
          readOnly: true
        - mountPath: /run/containerd/containerd.sock
          name: containerd
          readOnly: true
      volumes:
      - name: sys
        hostPath:
          path: /sys
      - name: proc
        hostPath:
          path: /proc
      - name: containerd
        hostPath:
          path: /run/k3s/containerd/containerd.sock
