apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: scaphandre-global-reader
rules:
- apiGroups: [""]
  resources: ["pods", "nodes", "namespaces"]
  verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: scaphandre-global-binding
subjects:
- kind: ServiceAccount
  name: scaphandre
  namespace: monitoring
roleRef:
  kind: ClusterRole
  name: scaphandre-global-reader
  apiGroup: rbac.authorization.k8s.io
