apiVersion: batch/v1
kind: Job
metadata:
  name: bench-native-n4-rand
spec:
  parallelism: 4
  completions: 4
  template:
    metadata:
      labels:
        app: bench-native-n4-rand
    spec:
      nodeName: sdn2
      containers:
      - name: benchmark
        image: memory-benchmark:v_numa4
        command: ["/bin/bash", "-c"]
        args:
          - |
            export POD_ID=$(hostname)
            export OUTPUT_DIR=/app/results/diagnostics/native-n4-rand-2/bench-native-n4-rand-${POD_ID}
            export EXPERIMENT_MODE="work"
            export PATTERN="random"
            
            mkdir -p "$OUTPUT_DIR"
            echo "--- NO NUMA PINNING (K8S NATIVE) ---"
            cd /app

            # ANCIEN COMPORTEMENT (pas de stagger) : décommenter cette ligne et commenter le bloc STAGGER ci-dessous pour revenir en arrière
            # python3 scripts/script_controlled.py --output-dir "$OUTPUT_DIR" --pattern "$PATTERN"

            # STAGGER POISSONIEN : décale le démarrage de chaque pod (loi exponentielle, moyenne 60s, plafond 180s)
            # pour éviter que les pods changent de taille de buffer en même temps
            DELAY=$(awk -v seed="$RANDOM$$" 'BEGIN{srand(seed); d=-log(1-rand())*60; if(d>180) d=180; printf "%.1f", d}')
            echo "[STAGGER] Sleeping ${DELAY}s before starting (Poisson-like jitter)"
            sleep "$DELAY"
            python3 scripts/script_controlled.py --output-dir "$OUTPUT_DIR" --pattern "$PATTERN"
            
        securityContext:
          privileged: true
        resources:
          requests:
            cpu: "1"
            memory: "1Gi"
          limits:
            cpu: "1"
            memory: "2Gi"
        volumeMounts:
        - name: results-volume
          mountPath: /app/results
        - name: script-python-volume
          mountPath: /app/scripts/script_controlled.py
          subPath: script_controlled.py
        - name: script-python-volume
          mountPath: /app/scripts/mem_stress_controlled.py
          subPath: mem_stress_controlled.py
      restartPolicy: Never
      volumes:
      - name: results-volume
        hostPath:
          path: /home/sdnuser/k8s-numa-benchmark/results
          type: DirectoryOrCreate
      - name: script-python-volume
        configMap:
          name: script-benchmark-controlled