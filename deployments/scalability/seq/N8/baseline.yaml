---
apiVersion: batch/v1
kind: Job
metadata:
  name: bench-base-n8-numa0-seq
spec:
  parallelism: 4
  completions: 4
  template:
    metadata:
      labels:
        app: bench-base-n8-numa0-seq
    spec:
      nodeName: sdn2
      containers:
      - name: benchmark
        image: memory-benchmark:v_numa4
        command: ["/bin/bash", "-c"]
        args:
          - |
            export POD_ID=$(hostname)
            export OUTPUT_DIR=/app/results/bench-base-n8-numa0-seq_${POD_ID}
            export BINDING_MODE="core"
            export PHYS_CPU_LIST="0,2,4,6"
            export MEM_NODE="0"
            export PATTERN="sequential"
            export EXPERIMENT_MODE="work"
            bash run_all.sh
        securityContext:
          privileged: true
        resources:
          requests:
            cpu: "1"
            memory: "1Gi"
          limits:
            cpu: "1"
            memory: "2Gi"
        volumeMounts:
        - name: results-volume
          mountPath: /app/results
        - name: script-python-volume
          mountPath: /app/scripts/script_controlled.py
          subPath: script_controlled.py
        - name: script-python-volume
          mountPath: /app/scripts/mem_stress_controlled.py
          subPath: mem_stress_controlled.py
        - name: script-python-volume
          mountPath: /app/run_all.sh
          subPath: run_all.sh
      restartPolicy: Never
      volumes:
      - name: results-volume
        hostPath:
          path: /home/sdnuser/k8s-numa-benchmark/results
          type: DirectoryOrCreate
      - name: script-python-volume
        configMap:
          name: script-benchmark-controlled
