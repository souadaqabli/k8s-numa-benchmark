---
apiVersion: v1
kind: Pod
metadata:
  name: benchmark-numa0
spec:
  nodeName: sdn2

  containers:
  - name: benchmark
    image: memory-benchmark:v_numa2

    command: ["/bin/bash", "-c"]
    args:
      - |
        export OUTPUT_DIR=/app/results/numa0_isolated
        export TARGET_NODE=0
        export POD_ID=$(hostname)
        bash run_all.sh

    securityContext:
      privileged: true

    resources:
      requests:
        cpu: "1"
        memory: "3Gi"
      limits:
        cpu: "1"
        memory: "3Gi"

    volumeMounts:
    - name: results-volume
      mountPath: /app/results

  restartPolicy: Never

  volumes:
  - name: results-volume
    hostPath:
      path: /home/sdnuser/k8s-numa-benchmark/results
      type: DirectoryOrCreate

