apiVersion: v1
kind: Pod
metadata:
  name: extreme-pod1-node1
spec:
  nodeName: sdn2
  containers:
  - name: benchmark
    image: memory-benchmark:v_numa3
    command: ["/bin/bash", "-c"]
    args:
      - "export OUTPUT_DIR=/app/results/extreme_pod1_cpu0_mem1; export CPU_NODE=0; export MEM_NODE=1; bash run_all.sh"
    securityContext: 
      privileged: true
    resources: 
      requests: { cpu: "1", memory: "3Gi" }
      limits: { cpu: "1", memory: "3Gi" }
    volumeMounts: 
      - name: results-volume
        mountPath: /app/results
  restartPolicy: Never
  volumes: 
    - name: results-volume
      hostPath: 
        path: /home/sdnuser/k8s-numa-benchmark/results
        type: DirectoryOrCreate
---
