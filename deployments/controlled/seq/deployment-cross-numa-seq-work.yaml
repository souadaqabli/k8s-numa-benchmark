apiVersion: batch/v1
kind: Job
metadata:
  name: benchmark-cross-numa0-seq-work
spec:
  parallelism: 2
  completions: 2
  template:
    metadata:
      labels:
        app: benchmark-cross-numa0-seq-work
    spec:
      nodeName: sdn2
      containers:
      - name: benchmark
        image: memory-benchmark:v_numa4
        command: ["/bin/bash", "-c"]
        args:
          - |
            export POD_ID=$(hostname)
            export OUTPUT_DIR=/app/results/cross_numa0_cpu0_mem1_seq_work_${POD_ID}
            export CPU_NODE=0
            export MEM_NODE=1
            export PATTERN="sequential"
            export EXPERIMENT_MODE="work"
            bash run_all.sh
        securityContext:
          privileged: true
        resources:
          requests:
            cpu: "2"
            memory: "7Gi"
          limits:
            cpu: "2"
            memory: "7Gi"
        volumeMounts:
        - name: results-volume
          mountPath: /app/results
        - name: script-python-volume
          mountPath: /app/scripts/script_controlled.py
          subPath: script_controlled.py
        - name: script-python-volume
          mountPath: /app/scripts/mem_stress_controlled.py
          subPath: mem_stress_controlled.py
        - name: script-python-volume
          mountPath: /app/run_all.sh
          subPath: run_all.sh
      restartPolicy: Never
      volumes:
      - name: results-volume
        hostPath:
          path: /home/sdnuser/k8s-numa-benchmark/results
          type: DirectoryOrCreate
      - name: script-python-volume
        configMap:
          name: script-benchmark-controlled
