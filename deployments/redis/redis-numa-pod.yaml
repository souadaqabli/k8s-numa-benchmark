apiVersion: v1
kind: Pod
metadata:
  name: redis-baseline
  labels:
    app: redis
    topology: baseline
spec:
  nodeName: sdn2  # Force le pod sur le worker node
  containers:
  - name: redis
    image: redis:7-alpine
    command: ["/bin/sh", "-c"]
    args:
      apk add numactl
      - numactl --physcpubind=0,2 --membind=0 redis-server --protected-mode no
    ports:
    - containerPort: 6379
    resources:
      limits:
        memory: "4Gi"
      requests:
        memory: "4Gi"
    securityContext:
      privileged: true  # Nécessaire pour numactl dans le conteneur
---
